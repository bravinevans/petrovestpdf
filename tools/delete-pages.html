<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete PDF Pages Online Free — Remove Unwanted Pages Visually | Petrovest PDF</title>
  <meta name="description" content="Click unwanted pages in your PDF thumbnail grid to remove them and download a clean PDF document.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="flex min-h-screen flex-col bg-[#f5f6f8] text-slate-900">
  <div id="app-header"></div>

  <main id="uploadStage" class="flex-grow px-4 py-10">
    <div class="mx-auto max-w-3xl text-center">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">Delete PDF Pages</h1>
      <p class="mt-2 text-base text-slate-600">
        Click any page in your document to mark it for removal, then save your clean PDF.
      </p>
    </div>

    <div id="dropZone" class="dropzone-box">
      <input id="fileInput" type="file" accept=".pdf,application/pdf" hidden>
      <button type="button" id="selectBtn" class="btn-primary-red">
        <i class="bi bi-file-earmark-x text-2xl"></i>
        <span>Select PDF File</span>
      </button>
      <p class="mt-3 text-sm font-medium text-slate-500">or drop a PDF file here</p>
    </div>
  </main>

  <section id="workspaceStage" class="studio-layout hidden flex-grow">
    <div class="studio-canvas">
      <div class="mb-4 flex w-full max-w-5xl flex-wrap items-center justify-between gap-2">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">
          Marked for deletion: <span id="deletedCountLabel" class="text-[#e5322d]">0</span> • Keeping: <span id="keepCountLabel" class="text-emerald-600">0</span>
        </span>
        <button type="button" id="restoreAllBtn" class="tool-btn"><i class="bi bi-arrow-counterclockwise"></i> Restore All Pages</button>
      </div>

      <div id="pagesGrid" class="grid w-full max-w-5xl grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5"></div>
    </div>

    <aside class="studio-sidebar">
      <div class="border-b border-slate-200 pb-3">
        <h2 class="text-lg font-extrabold text-slate-900">Delete Pages</h2>
        <p id="docNameLabel" class="mt-0.5 truncate text-xs text-slate-500">document.pdf</p>
      </div>

      <div class="mt-4 rounded-xl border border-amber-100 bg-amber-50 p-3 text-xs leading-relaxed text-amber-900">
        <i class="bi bi-exclamation-triangle-fill mr-1 text-amber-600"></i>
        Click on page thumbnails to toggle deletion. At least one page must remain in the output PDF.
      </div>

      <div class="mt-auto border-t border-slate-200 pt-4">
        <button type="button" id="saveActionBtn" class="btn-primary-red w-full text-base" disabled>
          <i class="bi bi-trash3"></i>
          <span>Apply &amp; Download PDF</span>
        </button>
      </div>
    </aside>
  </section>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/pdf-engine.js"></script>
  <script>
    SITE_CONFIG.mountChrome("delete-pages");

    let sourceBytes = null;
    let baseName = "document";
    let pages = []; // { num, previewUrl, deleted }

    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const pagesGrid = document.getElementById("pagesGrid");
    const saveBtn = document.getElementById("saveActionBtn");

    document.getElementById("selectBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => e.target.files[0] && loadPdf(e.target.files[0]));

    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("is-hover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("is-hover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("is-hover");
      if (e.dataTransfer.files[0]) loadPdf(e.dataTransfer.files[0]);
    });

    document.getElementById("restoreAllBtn").addEventListener("click", () => {
      pages.forEach((p) => { p.deleted = false; });
      renderPages();
    });

    async function loadPdf(file) {
      baseName = file.name.replace(/\.pdf$/i, "");
      document.getElementById("docNameLabel").textContent = file.name;
      sourceBytes = await file.arrayBuffer();
      const doc = await PdfEngine.loadPdfDocument(sourceBytes);

      document.getElementById("uploadStage").classList.add("hidden");
      document.getElementById("workspaceStage").classList.remove("hidden");

      pages = [];
      for (let i = 1; i <= doc.numPages; i += 1) {
        const canvas = document.createElement("canvas");
        await PdfEngine.renderPageToCanvas(doc, i, canvas, 0.55);
        pages.push({
          num: i,
          previewUrl: canvas.toDataURL("image/jpeg", 0.85),
          deleted: false
        });
      }
      renderPages();
    }

    function renderPages() {
      const deletedCount = pages.filter((p) => p.deleted).length;
      const keepCount = pages.length - deletedCount;
      document.getElementById("deletedCountLabel").textContent = deletedCount;
      document.getElementById("keepCountLabel").textContent = keepCount;
      saveBtn.disabled = deletedCount === 0 || keepCount === 0;

      pagesGrid.innerHTML = pages
        .map(
          (p, idx) => `
        <button type="button" data-idx="${idx}" class="group relative flex flex-col rounded-2xl border-2 p-2.5 text-center transition ${
            p.deleted
              ? "border-[#e5322d] bg-red-50/80 opacity-65"
              : "border-slate-200 bg-white shadow-xs hover:border-red-300"
          }">
          <span class="absolute right-3 top-3 z-10 flex h-7 w-7 items-center justify-center rounded-full text-xs font-bold ${
            p.deleted ? "bg-[#e5322d] text-white" : "bg-slate-100 text-slate-500 group-hover:bg-[#e5322d] group-hover:text-white"
          }">
            <i class="bi ${p.deleted ? "bi-trash-fill" : "bi-x-lg"}"></i>
          </span>
          <div class="relative flex h-44 w-full items-center justify-center overflow-hidden rounded-xl bg-slate-50 p-1.5">
            <img src="${p.previewUrl}" alt="Page ${p.num}" class="max-h-full max-w-full rounded shadow-xs ${p.deleted ? "grayscale" : ""}">
            ${
              p.deleted
                ? `<div class="absolute inset-0 flex items-center justify-center bg-red-600/15"><span class="rounded-md bg-[#e5322d] px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wider text-white">Removed</span></div>`
                : ""
            }
          </div>
          <span class="mt-2 text-xs font-bold ${p.deleted ? "line-through text-[#e5322d]" : "text-slate-700"}">Page ${p.num}</span>
        </button>
      `
        )
        .join("");

      pagesGrid.querySelectorAll("[data-idx]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.dataset.idx);
          pages[i].deleted = !pages[i].deleted;
          renderPages();
        });
      });
    }

    saveBtn.addEventListener("click", async () => {
      const keepIndices = pages.filter((p) => !p.deleted).map((p) => p.num - 1);
      if (!keepIndices.length) return;

      saveBtn.disabled = true;
      saveBtn.innerHTML = `<span>Removing Pages...</span>`;

      try {
        const srcDoc = await window.PDFLib.PDFDocument.load(sourceBytes.slice(0));
        const outDoc = await window.PDFLib.PDFDocument.create();
        const copied = await outDoc.copyPages(srcDoc, keepIndices);
        copied.forEach((p) => outDoc.addPage(p));

        const outBytes = await outDoc.save();
        PdfEngine.downloadBytes(outBytes, `${baseName}-cleaned.pdf`);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i class="bi bi-trash3"></i><span>Apply &amp; Download PDF</span>`;
      }
    });
  </script>
</body>
</html>
