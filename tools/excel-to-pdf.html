<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excel to PDF Converter Online Free — XLSX &amp; CSV to PDF | Petrovest PDF</title>
  <meta name="description" content="Convert Excel spreadsheets (XLSX, XLS, CSV) to clean formatted PDF tables with live sheet preview.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="flex min-h-screen flex-col bg-[#f5f6f8] text-slate-900">
  <div id="app-header"></div>

  <main id="uploadStage" class="flex-grow px-4 py-10">
    <div class="mx-auto max-w-3xl text-center">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">Excel to PDF</h1>
      <p class="mt-2 text-base text-slate-600">
        Convert XLSX, XLS, and CSV spreadsheets into clean PDF documents with live worksheet preview.
      </p>
    </div>

    <div id="dropZone" class="dropzone-box">
      <input id="fileInput" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden>
      <button type="button" id="selectBtn" class="btn-primary-red">
        <i class="bi bi-filetype-xlsx text-2xl"></i>
        <span>Select Excel / CSV File</span>
      </button>
      <p class="mt-3 text-sm font-medium text-slate-500">Supports .XLSX, .XLS, and .CSV — drop file here</p>
    </div>
  </main>

  <section id="workspaceStage" class="studio-layout hidden flex-grow">
    <div class="studio-canvas">
      <div class="w-full max-w-5xl">
        <div id="sheetTabs" class="mb-3 flex flex-wrap gap-1.5"></div>
        <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white p-4 shadow-xs">
          <table id="previewTable" class="min-w-full border-collapse text-left text-xs"></table>
        </div>
      </div>
    </div>

    <aside class="studio-sidebar">
      <div class="border-b border-slate-200 pb-3">
        <h2 class="text-lg font-extrabold text-slate-900">Excel to PDF</h2>
        <p id="docNameLabel" class="mt-0.5 truncate text-xs text-slate-500">workbook.xlsx</p>
      </div>

      <div id="statusBox" class="mt-4 rounded-xl border border-blue-100 bg-blue-50 p-3 text-xs leading-relaxed text-blue-900">
        Preview your worksheet tabs on the left, then click Convert to PDF.
      </div>

      <div class="mt-auto border-t border-slate-200 pt-4">
        <button type="button" id="convertBtn" class="btn-primary-red w-full text-base">
          <i class="bi bi-file-earmark-pdf"></i>
          <span>Convert to PDF</span>
        </button>
      </div>
    </aside>
  </section>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/pdf-engine.js"></script>
  <script>
    SITE_CONFIG.mountChrome("excel-to-pdf");

    let currentFile = null;
    let workbook = null;
    let activeSheet = "";

    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const convertBtn = document.getElementById("convertBtn");
    const statusBox = document.getElementById("statusBox");

    document.getElementById("selectBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => e.target.files[0] && loadWorkbook(e.target.files[0]));

    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("is-hover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("is-hover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("is-hover");
      if (e.dataTransfer.files[0]) loadWorkbook(e.dataTransfer.files[0]);
    });

    async function loadWorkbook(file) {
      currentFile = file;
      document.getElementById("docNameLabel").textContent = file.name;
      const bytes = await file.arrayBuffer();
      workbook = window.XLSX.read(bytes, { type: "array" });
      activeSheet = workbook.SheetNames[0];

      document.getElementById("uploadStage").classList.add("hidden");
      document.getElementById("workspaceStage").classList.remove("hidden");
      renderTabs();
      renderSheetTable();
    }

    function renderTabs() {
      const tabsEl = document.getElementById("sheetTabs");
      tabsEl.innerHTML = workbook.SheetNames.map(
        (name) => `
        <button type="button" data-sheet="${name}" class="rounded-lg px-3 py-1.5 text-xs font-bold transition ${
          name === activeSheet ? "bg-slate-900 text-white" : "border border-slate-200 bg-white text-slate-700 hover:border-emerald-400"
        }">${name}</button>`
      ).join("");

      tabsEl.querySelectorAll("button").forEach((b) => {
        b.addEventListener("click", () => {
          activeSheet = b.dataset.sheet;
          renderTabs();
          renderSheetTable();
        });
      });
    }

    function renderSheetTable() {
      const rows = window.XLSX.utils.sheet_to_json(workbook.Sheets[activeSheet], { header: 1, defval: "" });
      const previewRows = rows.slice(0, 60);
      const table = document.getElementById("previewTable");

      if (!previewRows.length) {
        table.innerHTML = `<tr><td class="p-4 text-slate-400">Empty worksheet</td></tr>`;
        return;
      }

      table.innerHTML = previewRows
        .map(
          (row, rIdx) => `
        <tr class="${rIdx === 0 ? "bg-slate-100 font-bold text-slate-800" : "border-t border-slate-100"}">
          ${row.map((cell) => `<td class="border-r border-slate-100 px-3 py-2 whitespace-nowrap">${String(cell).replace(/</g, "&lt;")}</td>`).join("")}
        </tr>`
        )
        .join("");
    }

    convertBtn.addEventListener("click", async () => {
      if (!currentFile) return;
      convertBtn.disabled = true;
      convertBtn.innerHTML = `<span>Converting...</span>`;

      try {
        const baseName = currentFile.name.replace(/\.(xlsx|xls|csv)$/i, "");
        const workerBytes = await PdfEngine.convertViaWorker("/api/office-to-pdf", currentFile, (msg) => {
          statusBox.textContent = msg;
        }).catch(() => null);

        if (workerBytes) {
          statusBox.textContent = "Converted with full LibreOffice Calc formatting!";
          PdfEngine.downloadBytes(workerBytes, `${baseName}.pdf`);
          return;
        }

        statusBox.textContent = "Converted in browser mode via AutoTable.";
        const pdf = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
        workbook.SheetNames.forEach((name, idx) => {
          if (idx > 0) pdf.addPage("a4", "landscape");
          const rows = window.XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1, defval: "" });
          if (!rows.length) return;
          pdf.setFontSize(12);
          pdf.text(name, 14, 14);
          pdf.autoTable({
            startY: 18,
            head: [rows[0]],
            body: rows.slice(1),
            styles: { fontSize: 8 }
          });
        });
        PdfEngine.downloadBytes(pdf.output("arraybuffer"), `${baseName}.pdf`);
      } finally {
        convertBtn.disabled = false;
        convertBtn.innerHTML = `<i class="bi bi-file-earmark-pdf"></i><span>Convert to PDF</span>`;
      }
    });
  </script>
</body>
</html>
