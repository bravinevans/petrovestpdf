<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Page Numbers to PDF Online Free — Live Preview | Petrovest PDF</title>
  <meta name="description" content="Stamp customizable page numbers onto your PDF with live position, typography, and format preview.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="flex min-h-screen flex-col bg-[#f5f6f8] text-slate-900">
  <div id="app-header"></div>

  <main id="uploadStage" class="flex-grow px-4 py-10">
    <div class="mx-auto max-w-3xl text-center">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">Add Page Numbers</h1>
      <p class="mt-2 text-base text-slate-600">
        Choose position, numbering style, and font size while previewing how numbers appear on your pages.
      </p>
    </div>

    <div id="dropZone" class="dropzone-box">
      <input id="fileInput" type="file" accept=".pdf,application/pdf" hidden>
      <button type="button" id="selectBtn" class="btn-primary-red">
        <i class="bi bi-123 text-2xl"></i>
        <span>Select PDF File</span>
      </button>
      <p class="mt-3 text-sm font-medium text-slate-500">or drop a PDF file here</p>
    </div>
  </main>

  <section id="workspaceStage" class="studio-layout hidden flex-grow">
    <div class="studio-canvas">
      <div class="mb-4 flex w-full max-w-5xl items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">
          Live Preview • <span id="pageCountLabel">0</span> pages
        </span>
      </div>
      <div id="pagesGrid" class="grid w-full max-w-5xl grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
    </div>

    <aside class="studio-sidebar">
      <div class="border-b border-slate-200 pb-3">
        <h2 class="text-lg font-extrabold text-slate-900">Page Numbers</h2>
        <p id="docNameLabel" class="mt-0.5 truncate text-xs text-slate-500">document.pdf</p>
      </div>

      <div class="mt-4 space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700">Position on Page</label>
          <select id="posSelect" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 font-medium">
            <option value="bottom-center" selected>Bottom Center</option>
            <option value="bottom-right">Bottom Right</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="top-center">Top Center</option>
            <option value="top-right">Top Right</option>
            <option value="top-left">Top Left</option>
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-700">Number Format</label>
          <select id="formatSelect" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 font-medium">
            <option value="n">1, 2, 3...</option>
            <option value="page_n">Page 1, Page 2...</option>
            <option value="n_of_total" selected>1 of N, 2 of N...</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-700">Start Number</label>
            <input id="startNumInput" type="number" min="1" value="1" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-medium">
          </div>
          <div>
            <label class="block font-bold text-slate-700">Font Size (pt)</label>
            <input id="fontSizeInput" type="number" min="8" max="28" value="11" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-medium">
          </div>
        </div>

        <label class="flex cursor-pointer items-center gap-2 pt-1 font-semibold text-slate-700">
          <input id="skipFirstCheck" type="checkbox" class="rounded text-[#e5322d]">
          <span>Skip cover page (Page 1)</span>
        </label>
      </div>

      <div class="mt-auto border-t border-slate-200 pt-4">
        <button type="button" id="applyBtn" class="btn-primary-red w-full text-base">
          <i class="bi bi-123"></i>
          <span>Add Page Numbers</span>
        </button>
      </div>
    </aside>
  </section>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/pdf-engine.js"></script>
  <script>
    SITE_CONFIG.mountChrome("page-numbers");

    let sourceBytes = null;
    let baseName = "document";
    let pages = [];

    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const pagesGrid = document.getElementById("pagesGrid");
    const applyBtn = document.getElementById("applyBtn");

    document.getElementById("selectBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => e.target.files[0] && loadPdf(e.target.files[0]));

    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("is-hover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("is-hover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("is-hover");
      if (e.dataTransfer.files[0]) loadPdf(e.dataTransfer.files[0]);
    });

    ["posSelect", "formatSelect", "startNumInput", "fontSizeInput", "skipFirstCheck"].forEach((id) => {
      document.getElementById(id).addEventListener("input", renderPages);
      document.getElementById(id).addEventListener("change", renderPages);
    });

    function formatLabel(idx, total) {
      const start = Math.max(1, Number(document.getElementById("startNumInput").value || 1));
      const fmt = document.getElementById("formatSelect").value;
      const num = start + idx;
      const tot = start + total - 1;
      if (fmt === "page_n") return `Page ${num}`;
      if (fmt === "n_of_total") return `${num} of ${tot}`;
      return `${num}`;
    }

    function positionClasses(pos) {
      const map = {
        "bottom-center": "bottom-2 left-1/2 -translate-x-1/2",
        "bottom-right": "bottom-2 right-2",
        "bottom-left": "bottom-2 left-2",
        "top-center": "top-2 left-1/2 -translate-x-1/2",
        "top-right": "top-2 right-2",
        "top-left": "top-2 left-2"
      };
      return map[pos] || map["bottom-center"];
    }

    async function loadPdf(file) {
      baseName = file.name.replace(/\.pdf$/i, "");
      document.getElementById("docNameLabel").textContent = file.name;
      sourceBytes = await file.arrayBuffer();
      const doc = await PdfEngine.loadPdfDocument(sourceBytes);

      document.getElementById("uploadStage").classList.add("hidden");
      document.getElementById("workspaceStage").classList.remove("hidden");
      document.getElementById("pageCountLabel").textContent = doc.numPages;

      pages = [];
      for (let i = 1; i <= doc.numPages; i += 1) {
        const canvas = document.createElement("canvas");
        await PdfEngine.renderPageToCanvas(doc, i, canvas, 0.55);
        pages.push({ num: i, previewUrl: canvas.toDataURL("image/jpeg", 0.85) });
      }
      renderPages();
    }

    function renderPages() {
      const pos = document.getElementById("posSelect").value;
      const skipFirst = document.getElementById("skipFirstCheck").checked;
      const posCls = positionClasses(pos);

      pagesGrid.innerHTML = pages
        .map((p, idx) => {
          const badge = skipFirst && idx === 0 ? "" : `<span class="absolute ${posCls} rounded bg-slate-900/85 px-2 py-0.5 text-[10px] font-bold text-white shadow">${formatLabel(idx, pages.length)}</span>`;
          return `
          <div class="flex flex-col rounded-2xl border border-slate-200 bg-white p-2.5 shadow-xs">
            <div class="relative flex h-48 items-center justify-center overflow-hidden rounded-xl bg-slate-50 p-2">
              <img src="${p.previewUrl}" alt="Page ${p.num}" class="max-h-full max-w-full rounded shadow-xs">
              ${badge}
            </div>
            <span class="mt-2 text-center text-xs font-bold text-slate-600">Page ${p.num}</span>
          </div>`;
        })
        .join("");
    }

    applyBtn.addEventListener("click", async () => {
      applyBtn.disabled = true;
      applyBtn.innerHTML = `<span>Numbering PDF...</span>`;

      try {
        const pdfDoc = await window.PDFLib.PDFDocument.load(sourceBytes.slice(0));
        const font = await pdfDoc.embedFont(window.PDFLib.StandardFonts.Helvetica);
        const pdfPages = pdfDoc.getPages();
        const pos = document.getElementById("posSelect").value;
        const skipFirst = document.getElementById("skipFirstCheck").checked;
        const size = Math.max(8, Number(document.getElementById("fontSizeInput").value || 11));

        pdfPages.forEach((page, idx) => {
          if (skipFirst && idx === 0) return;
          const label = formatLabel(idx, pdfPages.length);
          const { width, height } = page.getSize();
          const textW = font.widthOfTextAtSize(label, size);

          let x = (width - textW) / 2;
          let y = 24;
          if (pos.includes("right")) x = width - textW - 34;
          if (pos.includes("left")) x = 34;
          if (pos.startsWith("top")) y = height - 32;

          page.drawText(label, {
            x,
            y,
            size,
            font,
            color: window.PDFLib.rgb(0.15, 0.18, 0.24)
          });
        });

        const outBytes = await pdfDoc.save();
        PdfEngine.downloadBytes(outBytes, `${baseName}-numbered.pdf`);
      } finally {
        applyBtn.disabled = false;
        applyBtn.innerHTML = `<i class="bi bi-123"></i><span>Add Page Numbers</span>`;
      }
    });
  </script>
</body>
</html>
