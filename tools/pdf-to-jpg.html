<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF to JPG Converter Online Free — Extract Pages as Images | Petrovest PDF</title>
  <meta name="description" content="Convert every PDF page into high-resolution JPG images in your browser and download individually or as a ZIP archive.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="flex min-h-screen flex-col bg-[#f5f6f8] text-slate-900">
  <div id="app-header"></div>

  <main id="uploadStage" class="flex-grow px-4 py-10">
    <div class="mx-auto max-w-3xl text-center">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">PDF to JPG</h1>
      <p class="mt-2 text-base text-slate-600">
        Render every PDF page into a high-quality JPG image and download individual pages or a ZIP archive.
      </p>
    </div>

    <div id="dropZone" class="dropzone-box">
      <input id="fileInput" type="file" accept=".pdf,application/pdf" hidden>
      <button type="button" id="selectBtn" class="btn-primary-red">
        <i class="bi bi-file-image text-2xl"></i>
        <span>Select PDF File</span>
      </button>
      <p class="mt-3 text-sm font-medium text-slate-500">or drop a PDF file here</p>
    </div>
  </main>

  <section id="workspaceStage" class="studio-layout hidden flex-grow">
    <div class="studio-canvas">
      <div class="mb-4 flex w-full max-w-5xl items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">
          Rendered <span id="pageCountLabel">0</span> JPG Images
        </span>
      </div>
      <div id="pagesGrid" class="grid w-full max-w-5xl grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4"></div>
    </div>

    <aside class="studio-sidebar">
      <div class="border-b border-slate-200 pb-3">
        <h2 class="text-lg font-extrabold text-slate-900">PDF to JPG</h2>
        <p id="docNameLabel" class="mt-0.5 truncate text-xs text-slate-500">document.pdf</p>
      </div>

      <div class="mt-4 text-xs">
        <label class="block font-bold text-slate-700">Image Resolution</label>
        <select id="dpiSelect" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 font-medium">
          <option value="1.6" selected>Standard (150 DPI)</option>
          <option value="2.4">High Quality (220 DPI)</option>
        </select>
      </div>

      <div class="mt-auto border-t border-slate-200 pt-4">
        <button type="button" id="downloadAllBtn" class="btn-primary-red w-full text-base">
          <i class="bi bi-file-earmark-zip"></i>
          <span>Download All JPGs</span>
        </button>
      </div>
    </aside>
  </section>

  <div id="app-footer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/pdf-engine.js"></script>
  <script>
    SITE_CONFIG.mountChrome("pdf-to-jpg");

    let sourceBytes = null;
    let baseName = "document";
    let renderedPages = []; // { num, dataUrl }

    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const pagesGrid = document.getElementById("pagesGrid");
    const downloadAllBtn = document.getElementById("downloadAllBtn");

    document.getElementById("selectBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => e.target.files[0] && loadPdf(e.target.files[0]));
    document.getElementById("dpiSelect").addEventListener("change", () => sourceBytes && renderAll());

    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("is-hover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("is-hover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("is-hover");
      if (e.dataTransfer.files[0]) loadPdf(e.dataTransfer.files[0]);
    });

    async function loadPdf(file) {
      baseName = file.name.replace(/\.pdf$/i, "");
      document.getElementById("docNameLabel").textContent = file.name;
      sourceBytes = await file.arrayBuffer();
      document.getElementById("uploadStage").classList.add("hidden");
      document.getElementById("workspaceStage").classList.remove("hidden");
      await renderAll();
    }

    async function renderAll() {
      const scale = Number(document.getElementById("dpiSelect").value || 1.6);
      const doc = await PdfEngine.loadPdfDocument(sourceBytes);
      document.getElementById("pageCountLabel").textContent = doc.numPages;
      renderedPages = [];

      for (let i = 1; i <= doc.numPages; i += 1) {
        const canvas = document.createElement("canvas");
        await PdfEngine.renderPageToCanvas(doc, i, canvas, scale);
        renderedPages.push({ num: i, dataUrl: canvas.toDataURL("image/jpeg", 0.92) });
      }

      pagesGrid.innerHTML = renderedPages
        .map(
          (p) => `
        <div class="flex flex-col rounded-2xl border border-slate-200 bg-white p-2.5 shadow-xs">
          <div class="flex h-48 items-center justify-center overflow-hidden rounded-xl bg-slate-50 p-2">
            <img src="${p.dataUrl}" alt="Page ${p.num}" class="max-h-full max-w-full rounded shadow-xs">
          </div>
          <div class="mt-2.5 flex items-center justify-between px-1">
            <span class="text-xs font-bold text-slate-700">Page ${p.num}</span>
            <a href="${p.dataUrl}" download="${baseName}-page-${p.num}.jpg" class="rounded bg-slate-100 px-2 py-1 text-[11px] font-bold text-slate-700 hover:bg-[#e5322d] hover:text-white">
              <i class="bi bi-download"></i> JPG
            </a>
          </div>
        </div>`
        )
        .join("");
    }

    downloadAllBtn.addEventListener("click", async () => {
      if (!renderedPages.length) return;
      if (renderedPages.length === 1) {
        const a = document.createElement("a");
        a.href = renderedPages[0].dataUrl;
        a.download = `${baseName}-page-1.jpg`;
        a.click();
        return;
      }

      downloadAllBtn.disabled = true;
      downloadAllBtn.innerHTML = `<span>Zipping Images...</span>`;

      try {
        const zip = new window.JSZip();
        for (const p of renderedPages) {
          const base64 = p.dataUrl.split(",")[1];
          zip.file(`${baseName}-page-${p.num}.jpg`, base64, { base64: true });
        }
        const zipBytes = await zip.generateAsync({ type: "arraybuffer" });
        PdfEngine.downloadBytes(zipBytes, `${baseName}-jpgs.zip`, "application/zip");
      } finally {
        downloadAllBtn.disabled = false;
        downloadAllBtn.innerHTML = `<i class="bi bi-file-earmark-zip"></i><span>Download All JPGs</span>`;
      }
    });
  </script>
</body>
</html>
