<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF to Text Converter Online Free — Extract Text from PDF | Petrovest PDF</title>
  <meta name="description" content="Extract clean plain text from any PDF document directly in your browser. Preview, copy, or download as a TXT file.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="flex min-h-screen flex-col bg-[#f5f6f8] text-slate-900">
  <div id="app-header"></div>

  <main id="uploadStage" class="flex-grow px-4 py-10">
    <div class="mx-auto max-w-3xl text-center">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">PDF to Text</h1>
      <p class="mt-2 text-base text-slate-600">
        Extract readable text from your PDF document instantly — preview, copy, or download as a clean .TXT file.
      </p>
    </div>

    <div id="dropZone" class="dropzone-box">
      <input id="fileInput" type="file" accept=".pdf,application/pdf" hidden>
      <button type="button" id="selectBtn" class="btn-primary-red">
        <i class="bi bi-file-text text-2xl"></i>
        <span>Select PDF File</span>
      </button>
      <p class="mt-3 text-sm font-medium text-slate-500">or drop a PDF file here</p>
    </div>
  </main>

  <section id="workspaceStage" class="studio-layout hidden flex-grow">
    <div class="studio-canvas">
      <div class="w-full max-w-4xl">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-500">
            Extracted Text Preview • <span id="wordCountLabel">0</span> words
          </span>
          <button type="button" id="copyTextBtn" class="tool-btn">
            <i class="bi bi-clipboard"></i> Copy to Clipboard
          </button>
        </div>
        <textarea id="extractedTextarea" rows="22" class="w-full rounded-2xl border border-slate-300 bg-white p-5 font-mono text-xs leading-relaxed text-slate-800 shadow-xs focus:border-[#e5322d] focus:outline-none"></textarea>
      </div>
    </div>

    <aside class="studio-sidebar">
      <div class="border-b border-slate-200 pb-3">
        <h2 class="text-lg font-extrabold text-slate-900">PDF to Text</h2>
        <p id="docNameLabel" class="mt-0.5 truncate text-xs text-slate-500">document.pdf</p>
      </div>

      <div class="mt-4 space-y-2 text-xs">
        <label class="flex cursor-pointer items-center gap-2 font-semibold text-slate-700">
          <input id="pageHeadersCheck" type="checkbox" checked class="rounded text-[#e5322d]">
          <span>Include page separator headers (--- Page N ---)</span>
        </label>
      </div>

      <div class="mt-auto border-t border-slate-200 pt-4">
        <button type="button" id="downloadTxtBtn" class="btn-primary-red w-full text-base">
          <i class="bi bi-download"></i>
          <span>Download .TXT File</span>
        </button>
      </div>
    </aside>
  </section>

  <div id="app-footer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/pdf-engine.js"></script>
  <script>
    SITE_CONFIG.mountChrome("pdf-to-text");

    let baseName = "document";
    let pageTexts = [];

    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const textarea = document.getElementById("extractedTextarea");

    document.getElementById("selectBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => e.target.files[0] && loadPdf(e.target.files[0]));
    document.getElementById("pageHeadersCheck").addEventListener("change", renderText);

    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("is-hover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("is-hover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("is-hover");
      if (e.dataTransfer.files[0]) loadPdf(e.dataTransfer.files[0]);
    });

    async function loadPdf(file) {
      baseName = file.name.replace(/\.pdf$/i, "");
      document.getElementById("docNameLabel").textContent = file.name;
      const bytes = await file.arrayBuffer();
      const doc = await PdfEngine.loadPdfDocument(bytes);

      document.getElementById("uploadStage").classList.add("hidden");
      document.getElementById("workspaceStage").classList.remove("hidden");

      pageTexts = [];
      for (let i = 1; i <= doc.numPages; i += 1) {
        const page = await doc.getPage(i);
        const content = await page.getTextContent();
        const text = content.items.map((it) => it.str).join(" ").replace(/\s+/g, " ").trim();
        pageTexts.push({ num: i, text });
      }
      renderText();
    }

    function renderText() {
      const withHeaders = document.getElementById("pageHeadersCheck").checked;
      const joined = pageTexts
        .map((p) => (withHeaders ? `--- Page ${p.num} ---\n${p.text}` : p.text))
        .join("\n\n");
      textarea.value = joined;
      const words = joined.trim() ? joined.trim().split(/\s+/).length : 0;
      document.getElementById("wordCountLabel").textContent = words;
    }

    document.getElementById("copyTextBtn").addEventListener("click", async () => {
      await navigator.clipboard.writeText(textarea.value);
      const btn = document.getElementById("copyTextBtn");
      btn.innerHTML = `<i class="bi bi-check2"></i> Copied!`;
      setTimeout(() => { btn.innerHTML = `<i class="bi bi-clipboard"></i> Copy to Clipboard`; }, 1800);
    });

    document.getElementById("downloadTxtBtn").addEventListener("click", () => {
      const encoder = new TextEncoder();
      PdfEngine.downloadBytes(encoder.encode(textarea.value), `${baseName}.txt`, "text/plain;charset=utf-8");
    });
  </script>
</body>
</html>
