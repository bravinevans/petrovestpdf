<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF to Word Converter Online Free — PDF to Editable DOCX | Petrovest PDF</title>
  <meta name="description" content="Convert PDF files into editable Microsoft Word (.docx) documents with visual page preview.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="flex min-h-screen flex-col bg-[#f5f6f8] text-slate-900">
  <div id="app-header"></div>

  <main id="uploadStage" class="flex-grow px-4 py-10">
    <div class="mx-auto max-w-3xl text-center">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">PDF to Word</h1>
      <p class="mt-2 text-base text-slate-600">
        Turn any PDF file into an editable Microsoft Word (.docx) document in seconds.
      </p>
    </div>

    <div id="dropZone" class="dropzone-box">
      <input id="fileInput" type="file" accept=".pdf,application/pdf" hidden>
      <button type="button" id="selectBtn" class="btn-primary-red">
        <i class="bi bi-file-earmark-word text-2xl"></i>
        <span>Select PDF File</span>
      </button>
      <p class="mt-3 text-sm font-medium text-slate-500">or drop a PDF file here</p>
    </div>
  </main>

  <section id="workspaceStage" class="studio-layout hidden flex-grow">
    <div class="studio-canvas">
      <div class="mb-4 flex w-full max-w-5xl items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">
          Document Pages • <span id="pageCountLabel">0</span> pages
        </span>
      </div>
      <div id="pagesGrid" class="grid w-full max-w-5xl grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4"></div>
    </div>

    <aside class="studio-sidebar">
      <div class="border-b border-slate-200 pb-3">
        <h2 class="text-lg font-extrabold text-slate-900">PDF to Word (.docx)</h2>
        <p id="docNameLabel" class="mt-0.5 truncate text-xs text-slate-500">document.pdf</p>
      </div>

      <div id="statusBox" class="mt-4 rounded-xl border border-blue-100 bg-blue-50 p-3 text-xs leading-relaxed text-blue-900">
        Ready to convert PDF pages into an editable .DOCX document.
      </div>

      <div class="mt-auto border-t border-slate-200 pt-4">
        <button type="button" id="convertBtn" class="btn-primary-red w-full text-base">
          <i class="bi bi-file-earmark-word"></i>
          <span>Convert to Word (.docx)</span>
        </button>
      </div>
    </aside>
  </section>

  <div id="app-footer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/pdf-engine.js"></script>
  <script>
    SITE_CONFIG.mountChrome("pdf-to-word");

    let currentFile = null;
    let sourceBytes = null;

    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const pagesGrid = document.getElementById("pagesGrid");
    const convertBtn = document.getElementById("convertBtn");
    const statusBox = document.getElementById("statusBox");

    document.getElementById("selectBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => e.target.files[0] && loadPdf(e.target.files[0]));

    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("is-hover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("is-hover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("is-hover");
      if (e.dataTransfer.files[0]) loadPdf(e.dataTransfer.files[0]);
    });

    async function loadPdf(file) {
      currentFile = file;
      document.getElementById("docNameLabel").textContent = file.name;
      sourceBytes = await file.arrayBuffer();
      const doc = await PdfEngine.loadPdfDocument(sourceBytes);

      document.getElementById("uploadStage").classList.add("hidden");
      document.getElementById("workspaceStage").classList.remove("hidden");
      document.getElementById("pageCountLabel").textContent = doc.numPages;

      pagesGrid.innerHTML = "";
      for (let i = 1; i <= doc.numPages; i += 1) {
        const canvas = document.createElement("canvas");
        await PdfEngine.renderPageToCanvas(doc, i, canvas, 0.55);
        const url = canvas.toDataURL("image/jpeg", 0.85);
        pagesGrid.innerHTML += `
          <div class="flex flex-col rounded-2xl border border-slate-200 bg-white p-2.5 shadow-xs">
            <div class="flex h-44 items-center justify-center overflow-hidden rounded-xl bg-slate-50 p-2">
              <img src="${url}" alt="Page ${i}" class="max-h-full max-w-full rounded shadow-xs">
            </div>
            <span class="mt-2 text-center text-xs font-bold text-slate-600">Page ${i}</span>
          </div>`;
      }
    }

    convertBtn.addEventListener("click", async () => {
      if (!currentFile) return;
      convertBtn.disabled = true;
      convertBtn.innerHTML = `<span>Converting to DOCX...</span>`;

      try {
        const baseName = currentFile.name.replace(/\.pdf$/i, "");
        const workerBytes = await PdfEngine.convertViaWorker("/api/pdf-to-word", currentFile, (msg) => {
          statusBox.textContent = msg;
        }).catch(() => null);

        if (workerBytes) {
          statusBox.textContent = "Converted with full layout preservation!";
          PdfEngine.downloadBytes(
            workerBytes,
            `${baseName}.docx`,
            "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
          );
          return;
        }

        // Browser fallback via docx.js
        statusBox.textContent = "Converted in browser mode.";
        const doc = await PdfEngine.loadPdfDocument(sourceBytes);
        const children = [];
        for (let i = 1; i <= doc.numPages; i += 1) {
          const page = await doc.getPage(i);
          const content = await page.getTextContent();
          const line = content.items.map((it) => it.str).join(" ").replace(/\s+/g, " ").trim();
          children.push(new window.docx.Paragraph({ text: line || " " }));
        }
        const outDoc = new window.docx.Document({ sections: [{ children }] });
        const blob = await window.docx.Packer.toBlob(outDoc);
        PdfEngine.downloadBytes(
          await blob.arrayBuffer(),
          `${baseName}.docx`,
          "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        );
      } finally {
        convertBtn.disabled = false;
        convertBtn.innerHTML = `<i class="bi bi-file-earmark-word"></i><span>Convert to Word (.docx)</span>`;
      }
    });
  </script>
</body>
</html>
