<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PowerPoint to PDF Converter Online Free — PPTX to PDF | Petrovest PDF</title>
  <meta name="description" content="Convert PowerPoint presentations (PPTX, PPT) to crisp PDF documents with slide preview.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="flex min-h-screen flex-col bg-[#f5f6f8] text-slate-900">
  <div id="app-header"></div>

  <main id="uploadStage" class="flex-grow px-4 py-10">
    <div class="mx-auto max-w-3xl text-center">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">PowerPoint to PDF</h1>
      <p class="mt-2 text-base text-slate-600">
        Turn PPTX and PPT slideshows into clean, shareable PDF documents with live slide preview.
      </p>
    </div>

    <div id="dropZone" class="dropzone-box">
      <input id="fileInput" type="file" accept=".pptx,.ppt,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-powerpoint" hidden>
      <button type="button" id="selectBtn" class="btn-primary-red">
        <i class="bi bi-filetype-pptx text-2xl"></i>
        <span>Select PowerPoint File</span>
      </button>
      <p class="mt-3 text-sm font-medium text-slate-500">Supports .PPTX and .PPT — drop file here</p>
    </div>
  </main>

  <section id="workspaceStage" class="studio-layout hidden flex-grow">
    <div class="studio-canvas">
      <div class="mb-4 flex w-full max-w-5xl items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">
          Presentation Preview • <span id="slideCountLabel">0</span> slides detected
        </span>
      </div>
      <div id="slidesGrid" class="grid w-full max-w-5xl grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </div>

    <aside class="studio-sidebar">
      <div class="border-b border-slate-200 pb-3">
        <h2 class="text-lg font-extrabold text-slate-900">PPTX to PDF</h2>
        <p id="docNameLabel" class="mt-0.5 truncate text-xs text-slate-500">presentation.pptx</p>
      </div>

      <div id="statusBox" class="mt-4 rounded-xl border border-blue-100 bg-blue-50 p-3 text-xs leading-relaxed text-blue-900">
        Ready to convert slides into a high-resolution PDF document.
      </div>

      <div class="mt-auto border-t border-slate-200 pt-4">
        <button type="button" id="convertBtn" class="btn-primary-red w-full text-base">
          <i class="bi bi-file-earmark-pdf"></i>
          <span>Convert to PDF</span>
        </button>
      </div>
    </aside>
  </section>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/pdf-engine.js"></script>
  <script>
    SITE_CONFIG.mountChrome("pptx-to-pdf");

    let currentFile = null;
    let slideTexts = [];

    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const slidesGrid = document.getElementById("slidesGrid");
    const convertBtn = document.getElementById("convertBtn");
    const statusBox = document.getElementById("statusBox");

    document.getElementById("selectBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => e.target.files[0] && loadPptx(e.target.files[0]));

    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("is-hover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("is-hover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("is-hover");
      if (e.dataTransfer.files[0]) loadPptx(e.dataTransfer.files[0]);
    });

    async function loadPptx(file) {
      currentFile = file;
      document.getElementById("docNameLabel").textContent = file.name;
      document.getElementById("uploadStage").classList.add("hidden");
      document.getElementById("workspaceStage").classList.remove("hidden");
      slideTexts = [];

      if (file.name.toLowerCase().endsWith(".pptx")) {
        const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
        const slideFiles = Object.keys(zip.files)
          .filter((k) => /^ppt\/slides\/slide\d+\.xml$/i.test(k))
          .sort((a, b) => {
            const na = Number(a.match(/slide(\d+)\.xml/i)[1]);
            const nb = Number(b.match(/slide(\d+)\.xml/i)[1]);
            return na - nb;
          });

        for (let i = 0; i < slideFiles.length; i += 1) {
          const xml = await zip.files[slideFiles[i]].async("string");
          const doc = new DOMParser().parseFromString(xml, "application/xml");
          const runs = Array.from(doc.getElementsByTagName("a:t")).map((n) => n.textContent.trim()).filter(Boolean);
          slideTexts.push({ num: i + 1, title: runs[0] || `Slide ${i + 1}`, body: runs.slice(1).join(" ") });
        }
      } else {
        slideTexts.push({ num: 1, title: file.name, body: "Legacy .PPT binary presentation queued for server conversion." });
      }

      document.getElementById("slideCountLabel").textContent = slideTexts.length;
      slidesGrid.innerHTML = slideTexts
        .map(
          (s) => `
        <div class="flex aspect-video flex-col justify-between rounded-2xl border border-slate-200 bg-white p-4 shadow-xs">
          <div>
            <span class="rounded bg-orange-50 px-2 py-0.5 text-[10px] font-bold text-orange-600">Slide ${s.num}</span>
            <h3 class="mt-2 line-clamp-2 text-sm font-extrabold text-slate-900">${s.title.replace(/</g, "&lt;")}</h3>
            <p class="mt-1 line-clamp-3 text-xs text-slate-500">${(s.body || "").replace(/</g, "&lt;")}</p>
          </div>
        </div>`
        )
        .join("");
    }

    convertBtn.addEventListener("click", async () => {
      if (!currentFile) return;
      convertBtn.disabled = true;
      convertBtn.innerHTML = `<span>Converting...</span>`;

      try {
        const baseName = currentFile.name.replace(/\.(pptx|ppt)$/i, "");
        const workerBytes = await PdfEngine.convertViaWorker("/api/office-to-pdf", currentFile, (msg) => {
          statusBox.textContent = msg;
        }).catch(() => null);

        if (workerBytes) {
          statusBox.textContent = "Converted with full LibreOffice Impress fidelity!";
          PdfEngine.downloadBytes(workerBytes, `${baseName}.pdf`);
          return;
        }

        // Client-side fallback if worker URL is not set
        statusBox.textContent = "Converted in browser mode (set API.baseUrl in site-config.js for full slide graphics).";
        const pdf = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
        slideTexts.forEach((s, idx) => {
          if (idx > 0) pdf.addPage("a4", "landscape");
          pdf.setFont("helvetica", "bold");
          pdf.setFontSize(20);
          pdf.text(pdf.splitTextToSize(s.title, 260), 18, 28);
          pdf.setFont("helvetica", "normal");
          pdf.setFontSize(12);
          pdf.text(pdf.splitTextToSize(s.body || "", 260), 18, 48);
        });
        PdfEngine.downloadBytes(pdf.output("arraybuffer"), `${baseName}.pdf`);
      } finally {
        convertBtn.disabled = false;
        convertBtn.innerHTML = `<i class="bi bi-file-earmark-pdf"></i><span>Convert to PDF</span>`;
      }
    });
  </script>
</body>
</html>
