<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotate PDF Pages Online Free — Permanent PDF Rotator | Petrovest PDF</title>
  <meta name="description" content="Rotate individual PDF pages or entire documents permanently with live thumbnail preview.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="flex min-h-screen flex-col bg-[#f5f6f8] text-slate-900">
  <div id="app-header"></div>

  <main id="uploadStage" class="flex-grow px-4 py-10">
    <div class="mx-auto max-w-3xl text-center">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">Rotate PDF</h1>
      <p class="mt-2 text-base text-slate-600">
        Rotate single pages or your whole PDF document permanently and see the exact orientation before downloading.
      </p>
    </div>

    <div id="dropZone" class="dropzone-box">
      <input id="fileInput" type="file" accept=".pdf,application/pdf" hidden>
      <button type="button" id="selectBtn" class="btn-primary-red">
        <i class="bi bi-arrow-clockwise text-2xl"></i>
        <span>Select PDF File</span>
      </button>
      <p class="mt-3 text-sm font-medium text-slate-500">or drop a PDF file here</p>
    </div>
  </main>

  <section id="workspaceStage" class="studio-layout hidden flex-grow">
    <div class="studio-canvas">
      <div class="mb-4 flex w-full max-w-5xl items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Click any page thumbnail to rotate 90° clockwise</span>
        <button type="button" id="resetRotBtn" class="tool-btn"><i class="bi bi-arrow-counterclockwise"></i> Reset All (0°)</button>
      </div>

      <div id="pagesGrid" class="grid w-full max-w-5xl grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5"></div>
    </div>

    <aside class="studio-sidebar">
      <div class="border-b border-slate-200 pb-3">
        <h2 class="text-lg font-extrabold text-slate-900">Rotate PDF</h2>
        <p id="docNameLabel" class="mt-0.5 truncate text-xs text-slate-500">document.pdf</p>
      </div>

      <div class="mt-4 space-y-2">
        <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Batch Rotate</p>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="rotAllRightBtn" class="tool-btn justify-center py-2.5">
            <i class="bi bi-arrow-clockwise"></i> All +90°
          </button>
          <button type="button" id="rotAllLeftBtn" class="tool-btn justify-center py-2.5">
            <i class="bi bi-arrow-counterclockwise"></i> All -90°
          </button>
          <button type="button" id="rotOddBtn" class="tool-btn justify-center py-2">Odd Pages +90°</button>
          <button type="button" id="rotEvenBtn" class="tool-btn justify-center py-2">Even Pages +90°</button>
        </div>
      </div>

      <div class="mt-auto border-t border-slate-200 pt-4">
        <button type="button" id="saveActionBtn" class="btn-primary-red w-full text-base">
          <i class="bi bi-download"></i>
          <span>Rotate &amp; Download PDF</span>
        </button>
      </div>
    </aside>
  </section>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/pdf-engine.js"></script>
  <script>
    SITE_CONFIG.mountChrome("rotate-pdf");

    let sourceBytes = null;
    let baseName = "document";
    let pages = []; // { num, previewUrl, rotation }

    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const pagesGrid = document.getElementById("pagesGrid");
    const saveBtn = document.getElementById("saveActionBtn");

    document.getElementById("selectBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => e.target.files[0] && loadPdf(e.target.files[0]));

    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("is-hover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("is-hover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("is-hover");
      if (e.dataTransfer.files[0]) loadPdf(e.dataTransfer.files[0]);
    });

    document.getElementById("rotAllRightBtn").addEventListener("click", () => {
      pages.forEach((p) => { p.rotation = (p.rotation + 90) % 360; });
      renderPages();
    });

    document.getElementById("rotAllLeftBtn").addEventListener("click", () => {
      pages.forEach((p) => { p.rotation = (p.rotation + 270) % 360; });
      renderPages();
    });

    document.getElementById("rotOddBtn").addEventListener("click", () => {
      pages.forEach((p) => { if (p.num % 2 === 1) p.rotation = (p.rotation + 90) % 360; });
      renderPages();
    });

    document.getElementById("rotEvenBtn").addEventListener("click", () => {
      pages.forEach((p) => { if (p.num % 2 === 0) p.rotation = (p.rotation + 90) % 360; });
      renderPages();
    });

    document.getElementById("resetRotBtn").addEventListener("click", () => {
      pages.forEach((p) => { p.rotation = 0; });
      renderPages();
    });

    async function loadPdf(file) {
      baseName = file.name.replace(/\.pdf$/i, "");
      document.getElementById("docNameLabel").textContent = file.name;
      sourceBytes = await file.arrayBuffer();
      const doc = await PdfEngine.loadPdfDocument(sourceBytes);

      document.getElementById("uploadStage").classList.add("hidden");
      document.getElementById("workspaceStage").classList.remove("hidden");

      pages = [];
      for (let i = 1; i <= doc.numPages; i += 1) {
        const canvas = document.createElement("canvas");
        await PdfEngine.renderPageToCanvas(doc, i, canvas, 0.55);
        pages.push({
          num: i,
          previewUrl: canvas.toDataURL("image/jpeg", 0.85),
          rotation: 0
        });
      }
      renderPages();
    }

    function renderPages() {
      pagesGrid.innerHTML = pages
        .map(
          (p, idx) => `
        <button type="button" data-idx="${idx}" class="group relative flex flex-col rounded-2xl border border-slate-200 bg-white p-2.5 text-center shadow-xs transition hover:border-[#e5322d] hover:shadow-md">
          <div class="mb-1.5 flex w-full items-center justify-between text-[11px] font-bold">
            <span class="text-slate-500">Page ${p.num}</span>
            <span class="rounded px-1.5 py-0.5 ${p.rotation ? "bg-red-50 text-[#e5322d]" : "bg-slate-100 text-slate-500"}">${p.rotation}°</span>
          </div>
          <div class="flex h-44 w-full items-center justify-center overflow-hidden rounded-xl bg-slate-50 p-2">
            <img src="${p.previewUrl}" alt="Page ${p.num}" class="max-h-full max-w-full rounded shadow-xs transition-transform duration-150" style="transform: rotate(${p.rotation}deg)">
          </div>
        </button>
      `
        )
        .join("");

      pagesGrid.querySelectorAll("[data-idx]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.dataset.idx);
          pages[i].rotation = (pages[i].rotation + 90) % 360;
          renderPages();
        });
      });
    }

    saveBtn.addEventListener("click", async () => {
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<span>Rotating PDF...</span>`;

      try {
        const pdfDoc = await window.PDFLib.PDFDocument.load(sourceBytes.slice(0));
        const pdfPages = pdfDoc.getPages();

        pages.forEach((p, idx) => {
          if (p.rotation && pdfPages[idx]) {
            const cur = pdfPages[idx].getRotation()?.angle || 0;
            pdfPages[idx].setRotation(window.PDFLib.degrees((cur + p.rotation) % 360));
          }
        });

        const outBytes = await pdfDoc.save();
        PdfEngine.downloadBytes(outBytes, `${baseName}-rotated.pdf`);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i class="bi bi-download"></i><span>Rotate &amp; Download PDF</span>`;
      }
    });
  </script>
</body>
</html>
