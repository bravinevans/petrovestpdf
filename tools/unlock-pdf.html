<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unlock PDF Online Free — Remove PDF Password &amp; Restrictions | Petrovest PDF</title>
  <meta name="description" content="Remove password protection and print or copy restrictions from your PDF file instantly.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="flex min-h-screen flex-col bg-[#f5f6f8] text-slate-900">
  <div id="app-header"></div>

  <main id="uploadStage" class="flex-grow px-4 py-10">
    <div class="mx-auto max-w-3xl text-center">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">Unlock PDF</h1>
      <p class="mt-2 text-base text-slate-600">
        Remove open passwords and print/copy restrictions from your PDF document.
      </p>
    </div>

    <div id="dropZone" class="dropzone-box">
      <input id="fileInput" type="file" accept=".pdf,application/pdf" hidden>
      <button type="button" id="selectBtn" class="btn-primary-red">
        <i class="bi bi-unlock-fill text-2xl"></i>
        <span>Select Protected PDF</span>
      </button>
      <p class="mt-3 text-sm font-medium text-slate-500">or drop a locked PDF file here</p>
    </div>
  </main>

  <section id="workspaceStage" class="studio-layout hidden flex-grow">
    <div class="studio-canvas justify-center">
      <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm">
        <div class="mx-auto flex h-24 w-24 items-center justify-center rounded-2xl bg-red-50 text-[#e5322d]">
          <i class="bi bi-file-earmark-lock2-fill text-5xl"></i>
        </div>
        <h3 id="docNameLabel" class="mt-4 truncate text-base font-extrabold text-slate-900">protected.pdf</h3>
        <p id="fileSizeLabel" class="mt-1 text-xs text-slate-500">0 KB • Encrypted PDF Document</p>
      </div>
    </div>

    <aside class="studio-sidebar">
      <div class="border-b border-slate-200 pb-3">
        <h2 class="text-lg font-extrabold text-slate-900">Unlock PDF</h2>
        <p class="mt-0.5 text-xs text-slate-500">Enter password if required to open the file</p>
      </div>

      <div class="mt-4 space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700">PDF Password (leave blank if only print/copy locked)</label>
          <div class="relative mt-1">
            <input id="passInput" type="password" placeholder="Enter PDF password" class="w-full rounded-lg border border-slate-300 px-3 py-2 pr-9 font-semibold focus:border-[#e5322d] focus:outline-none">
            <button type="button" id="togglePassBtn" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div id="statusBox" class="hidden rounded-xl border border-red-200 bg-red-50 p-3 font-semibold text-[#e5322d]"></div>
      </div>

      <div class="mt-auto border-t border-slate-200 pt-4">
        <button type="button" id="unlockBtn" class="btn-primary-red w-full text-base">
          <i class="bi bi-unlock-fill"></i>
          <span>Unlock &amp; Download PDF</span>
        </button>
      </div>
    </aside>
  </section>

  <div id="app-footer"></div>

  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/pdf-engine.js"></script>
  <script>
    SITE_CONFIG.mountChrome("unlock-pdf");

    let currentFile = null;
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const passInput = document.getElementById("passInput");
    const statusBox = document.getElementById("statusBox");
    const unlockBtn = document.getElementById("unlockBtn");

    document.getElementById("selectBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => e.target.files[0] && loadFile(e.target.files[0]));

    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("is-hover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("is-hover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("is-hover");
      if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });

    document.getElementById("togglePassBtn").addEventListener("click", () => {
      passInput.type = passInput.type === "password" ? "text" : "password";
    });

    function loadFile(file) {
      currentFile = file;
      document.getElementById("docNameLabel").textContent = file.name;
      document.getElementById("fileSizeLabel").textContent = `${(file.size / 1024).toFixed(1)} KB • Ready to unlock`;
      document.getElementById("uploadStage").classList.add("hidden");
      document.getElementById("workspaceStage").classList.remove("hidden");
    }

    function showError(msg) {
      statusBox.textContent = msg;
      statusBox.classList.remove("hidden");
    }

    unlockBtn.addEventListener("click", async () => {
      statusBox.classList.add("hidden");
      const base = (SITE_CONFIG.API?.baseUrl || "").replace(/\/+$/, "");
      if (!base) return showError("Worker URL is not configured in site-config.js.");

      unlockBtn.disabled = true;
      unlockBtn.innerHTML = `<span>Unlocking PDF...</span>`;

      try {
        const form = new FormData();
        form.append("file", currentFile);
        form.append("password", passInput.value || "");

        const res = await fetch(`${base}/api/unlock-pdf`, { method: "POST", body: form });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: "Unlock failed." }));
          throw new Error(err.detail || "Unlock failed.");
        }

        const outBytes = await res.arrayBuffer();
        const baseName = currentFile.name.replace(/\.pdf$/i, "");
        PdfEngine.downloadBytes(outBytes, `${baseName}-unlocked.pdf`);
      } catch (err) {
        showError(err.message);
      } finally {
        unlockBtn.disabled = false;
        unlockBtn.innerHTML = `<i class="bi bi-unlock-fill"></i><span>Unlock &amp; Download PDF</span>`;
      }
    });
  </script>
</body>
</html>
