<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word to PDF Converter Online Free — DOCX &amp; DOC to PDF | Petrovest PDF</title>
  <meta name="description" content="Convert Microsoft Word documents (DOCX, DOC) to clean PDF files with live document preview.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="flex min-h-screen flex-col bg-[#f5f6f8] text-slate-900">
  <div id="app-header"></div>

  <main id="uploadStage" class="flex-grow px-4 py-10">
    <div class="mx-auto max-w-3xl text-center">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">Word to PDF</h1>
      <p class="mt-2 text-base text-slate-600">
        Convert DOCX and DOC documents into crisp, universally readable PDF files with live preview.
      </p>
    </div>

    <div id="dropZone" class="dropzone-box">
      <input id="fileInput" type="file" accept=".docx,.doc,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword" hidden>
      <button type="button" id="selectBtn" class="btn-primary-red">
        <i class="bi bi-filetype-docx text-2xl"></i>
        <span>Select Word Document</span>
      </button>
      <p class="mt-3 text-sm font-medium text-slate-500">Supports .DOCX and .DOC — drop file here</p>
    </div>
  </main>

  <section id="workspaceStage" class="studio-layout hidden flex-grow">
    <div class="studio-canvas">
      <div id="docPaper" class="w-full max-w-3xl rounded-xl border border-slate-200 bg-white p-10 text-sm leading-relaxed text-slate-800 shadow-md"></div>
    </div>

    <aside class="studio-sidebar">
      <div class="border-b border-slate-200 pb-3">
        <h2 class="text-lg font-extrabold text-slate-900">Word to PDF</h2>
        <p id="docNameLabel" class="mt-0.5 truncate text-xs text-slate-500">document.docx</p>
      </div>

      <div id="statusBox" class="mt-4 rounded-xl border border-blue-100 bg-blue-50 p-3 text-xs leading-relaxed text-blue-900">
        Document loaded. Click Convert to PDF to generate your PDF file.
      </div>

      <div class="mt-auto border-t border-slate-200 pt-4">
        <button type="button" id="convertBtn" class="btn-primary-red w-full text-base">
          <i class="bi bi-file-earmark-pdf"></i>
          <span>Convert to PDF</span>
        </button>
      </div>
    </aside>
  </section>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/pdf-engine.js"></script>
  <script>
    SITE_CONFIG.mountChrome("word-to-pdf");

    let currentFile = null;
    let extractedText = "";

    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const convertBtn = document.getElementById("convertBtn");
    const statusBox = document.getElementById("statusBox");

    document.getElementById("selectBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => e.target.files[0] && loadDocx(e.target.files[0]));

    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("is-hover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("is-hover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("is-hover");
      if (e.dataTransfer.files[0]) loadDocx(e.dataTransfer.files[0]);
    });

    async function loadDocx(file) {
      currentFile = file;
      document.getElementById("docNameLabel").textContent = file.name;
      document.getElementById("uploadStage").classList.add("hidden");
      document.getElementById("workspaceStage").classList.remove("hidden");

      const paper = document.getElementById("docPaper");
      if (file.name.toLowerCase().endsWith(".docx")) {
        const bytes = await file.arrayBuffer();
        const htmlRes = await window.mammoth.convertToHtml({ arrayBuffer: bytes.slice(0) });
        const rawRes = await window.mammoth.extractRawText({ arrayBuffer: bytes.slice(0) });
        extractedText = rawRes.value || "";
        paper.innerHTML = htmlRes.value || "<p class='text-slate-400'>Empty document</p>";
      } else {
        extractedText = file.name;
        paper.innerHTML = `<p class="font-semibold text-slate-600">${file.name} — Legacy .DOC file ready for LibreOffice conversion.</p>`;
      }
    }

    convertBtn.addEventListener("click", async () => {
      if (!currentFile) return;
      convertBtn.disabled = true;
      convertBtn.innerHTML = `<span>Converting...</span>`;

      try {
        const baseName = currentFile.name.replace(/\.(docx|doc)$/i, "");
        const workerBytes = await PdfEngine.convertViaWorker("/api/office-to-pdf", currentFile, (msg) => {
          statusBox.textContent = msg;
        }).catch(() => null);

        if (workerBytes) {
          statusBox.textContent = "Converted with full LibreOffice Writer fidelity!";
          PdfEngine.downloadBytes(workerBytes, `${baseName}.pdf`);
          return;
        }

        statusBox.textContent = "Converted in browser mode.";
        const pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        const lines = pdf.splitTextToSize(extractedText || " ", 180);
        let y = 20;
        lines.forEach((line) => {
          if (y > 280) {
            pdf.addPage();
            y = 20;
          }
          pdf.text(line, 15, y);
          y += 6;
        });
        PdfEngine.downloadBytes(pdf.output("arraybuffer"), `${baseName}.pdf`);
      } finally {
        convertBtn.disabled = false;
        convertBtn.innerHTML = `<i class="bi bi-file-earmark-pdf"></i><span>Convert to PDF</span>`;
      }
    });
  </script>
</body>
</html>
